# Blog Medicinal — produção na VPS
#
# Uso:
#   cp .env.example .env   # preencher os valores
#   docker compose up -d --build
#
# O container escuta em 127.0.0.1:3010 (mude com BLOG_PORT no .env). O proxy reverso da VPS
# (CloudPanel, Caddy, Nginx etc.) publica blog.medicinalnaweb.com.br com HTTPS.
services:
  blog:
    build:
      context: .
      args:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    image: medicinal-blog:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BLOG_PORT:-3010}:3000"
    volumes:
      - blog-cache:/app/.next/cache

volumes:
  blog-cache:
